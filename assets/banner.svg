<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Anand Chaudhari - Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
  </defs>
  <style>
    .name { font: 700 54px 'Segoe UI', Arial, Helvetica, sans-serif; fill: #ffffff; animation: rise 1.2s ease-out both; }
    .role { font: 600 22px 'Courier New', Courier, monospace; fill: #58a6ff; opacity: 0; }
    .r1 { animation: cycle 12s infinite 0s; }
    .r2 { animation: cycle 12s infinite 3s; }
    .r3 { animation: cycle 12s infinite 6s; }
    .r4 { animation: cycle 12s infinite 9s; }
    .bar { animation: grow 1.6s ease-out both; transform-origin: 450px 150px; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes cycle {
      0% { opacity: 0; }
      3% { opacity: 1; }
      21% { opacity: 1; }
      25% { opacity: 0; }
      100% { opacity: 0; }
    }
  </style>

  <rect width="900" height="260" rx="18" fill="url(#bg)"/>

  <circle cx="90" cy="60" r="38" fill="#58a6ff" opacity="0.12">
    <animate attributeName="cy" values="60;90;60" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="200" r="54" fill="#7ee787" opacity="0.10">
    <animate attributeName="cy" values="200;170;200" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="50" r="24" fill="#ffffff" opacity="0.08">
    <animate attributeName="cx" values="720;750;720" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="210" r="28" fill="#ffffff" opacity="0.07">
    <animate attributeName="cx" values="150;120;150" dur="6.5s" repeatCount="indefinite"/>
  </circle>

  <text class="name" x="450" y="115" text-anchor="middle">Anand Chaudhari</text>
  <rect class="bar" x="300" y="135" width="300" height="4" rx="2" fill="url(#accent)"/>

  <text class="role r1" x="450" y="190" text-anchor="middle">&lt; Full-Stack Developer /&gt;</text>
  <text class="role r2" x="450" y="190" text-anchor="middle">Python | FastAPI | React | Firebase</text>
  <text class="role r3" x="450" y="190" text-anchor="middle">Building AI apps with LLMs &amp; RAG</text>
  <text class="role r4" x="450" y="190" text-anchor="middle">MCA Student | Always Learning</text>
</svg>
